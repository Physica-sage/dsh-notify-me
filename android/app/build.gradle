plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
  namespace 'io.github.dshnotify.client'
  compileSdk 35
  defaultConfig { applicationId 'io.github.dshnotify.client'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.2.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes { release { minifyEnabled false } }
  testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
  implementation platform('com.google.firebase:firebase-bom:33.16.0')
  implementation 'com.google.firebase:firebase-messaging'
  implementation 'androidx.work:work-runtime:2.10.1'
  testImplementation 'junit:junit:4.13.2'
}
