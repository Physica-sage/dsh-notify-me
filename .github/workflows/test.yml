# Desktop regression and native FCM backend tests; Firebase delivery is mocked.
# the suites straight from the checkout on both platforms that ship a desktop
# shell. Ubuntu is the case that would have caught the 1.14.0 Linux raise
# regression; Windows exercises the PowerShell verdict path in
# smoke/host-route-test.mjs.
name: test

on:
  push:
    branches: [main, fcm-android]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Install locked dependencies; tests do not need Firebase account credentials.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run pack
